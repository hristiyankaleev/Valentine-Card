<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>За Маги</title>
    <style>
        :root {
            --bg-pink: #ff4d8d;
            --btn-pink: #ff75a7;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-pink);
            background-image: radial-gradient(rgba(255,255,255,0.2) 20%, transparent 20%);
            background-size: 40px 40px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            text-align: center;
            color: var(--text-white);
        }

        .container {
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 5px;
        }

        /* Forced into two lines */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 30px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Horizontal button layout */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 12px;
            border: 2px solid #333;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }

        #yes-btn {
            background-color: white;
            color: var(--bg-pink);
        }

        #no-btn {
            background-color: var(--btn-pink);
            color: #4a1529;
            position: relative; /* Starts next to the Yes button */
            transition: all 0.15s ease;
        }

        /* Success Message - Forced one line */
        #success {
            display: none;
            font-size: 1.8rem;
            font-weight: 900;
            white-space: nowrap;
            width: 100%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pop 0.4s ease-out;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h2>Здравей, Маги</h2>
        <h1>
            <span>ЩЕ МИ БЪДЕШ ЛИ</span>
            <span>ВАЛЕНТИНКА?</span>
        </h1>
        
        <div class="btn-wrapper">
            <button class="btn" id="yes-btn" onclick="celebrate()">ДА, РАЗБИРА СЕ</button>
            <button class="btn" id="no-btn" onmouseover="moveButton()" ontouchstart="moveButton()">НЕ</button>
        </div>
    </div>

    <div id="success">ПРАВИЛЕН ОТГОВОР! ❤️</div>

    <script>
        function moveButton() {
            const btn = document.getElementById('no-btn');
            
            // On first interaction, we switch it to absolute so it can jump anywhere
            btn.style.position = 'fixed';
            
            // Restricted movement area to keep it on screen
            const padding = 50;
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - padding);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - padding);
            
            btn.style.left = Math.max(padding, x) + 'px';
            btn.style.top = Math.max(padding, y) + 'px';
        }

        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.transition = 'transform 3s linear, opacity 3s';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translateY(-110vh) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
            }, 100);

            setTimeout(() => heart.remove(), 3000);
        }
    </script>
</body>
</html>
